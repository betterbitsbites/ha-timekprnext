[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tk-protocol"
version = "0.1.0"
description = "Shared topics, payloads and bus abstraction for tk-agent and tk-budget"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["tk_protocol"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
