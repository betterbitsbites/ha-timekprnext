[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tk-budget"
version = "0.1.0"
description = "Central shared time budget for Timekpr-nExT clients (Home Assistant add-on)"
requires-python = ">=3.11"
dependencies = ["paho-mqtt>=2.0"]

[tool.setuptools]
packages = ["tk_budget"]

[tool.pytest.ini_options]
pythonpath = [".", "../protocol"]
testpaths = ["tests"]
