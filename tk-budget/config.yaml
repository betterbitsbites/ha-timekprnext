name: tk-budget
version: "0.6.0"
slug: tk_budget
description: Shared weekly screen-time budget for Timekpr-nExT clients
url: https://github.com/<owner>/ha-timekprnext
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: application
boot: auto
# Broker credentials come from the Mosquitto add-on via the Supervisor.
services:
  - mqtt:need
# Kids are not configured: every timekpr user reported by a PC appears automatically.
# Core API proxy, to read the Google Family Link sensors.
homeassistant_api: true
# Dashboard links http://<ha-host>:8099/connect/<kid>/<host> redirect to the PC's rdp:// or vnc:// URL.
ports:
  "8099/tcp": 8099
ports_description:
  "8099/tcp": Remote-connect redirect links for the dashboard
options:
  db_path: /data/tk-budget.db
  familylink: []
  link_port: 8099
schema:
  db_path: str
  # Port the redirect server listens on inside the add-on (keep it in line with `ports`)
  link_port: port
  # Kids with a Google Family Link sensor (phone time), e.g. kid: kid-a, entity: sensor.<child>_daily_screen_time
  familylink:
    - kid: str
      entity: str
  # Only to use a broker other than the Mosquitto add-on:
  broker_host: str?
  broker_port: port?
  broker_user: str?
  broker_password: password?
